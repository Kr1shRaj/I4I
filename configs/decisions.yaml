# Annotation decisions for the 99 gate-accepted high-angle images (datasets/highangle/index.json).
# Reviewed by Claude on gridded review sheets and full-resolution zooms, 2026-10-21 (not a human annotator).
# Classes follow image content, never the search keyword. Policy: docs/label_policy.md.
# accept: boxes = [class, x1, y1, x2, y2] (normalised) -> SAM 2.1 Large box prompts, one per instance.
# reject reasons: aerial (satellite/drone, no labelable instance), collage (several photos / infographic / slide),
#   render (AI or CAD image), closeup (a part only, <40% of a machine), no_target (none of the 9 classes),
#   ambiguous (class or extent unclear: log band mills, moulders, workstations with built-in saws),
#   dense (rows of small instances or unidentifiable background machines that cannot all be labelled).
# Class-boundary calls (checked against catalog samples): horizontal metal-cutting band saws = band_saw;
#   vertical, sliding-table and beam panel saws = panel_saw; mechanical/hydraulic frame presses and
#   multi-platen hot presses = hydraulic_press.

