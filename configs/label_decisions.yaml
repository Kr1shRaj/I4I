# Label-fix decisions for the run8 rebuild (2026-10-21). Applied by scripts/tools/build_clean_9class_dataset.py.
# Reviewed visually by Claude on overlay sheets (not by a human annotator); see docs/label_policy.md.

edge_bander:
  # Indices into edge_bander_proposals.json (175 polygons whose box covers > 80% of the image).
  # accept: replace the old polygon with the SAM 2.1 proposal (machine on a plain/studio background).
  accept: [3, 5, 7, 8, 9, 10, 12, 14, 16, 17, 18, 19, 21, 23, 24, 25, 26, 27, 31, 33, 34, 35, 38,
           41, 46, 47, 48, 49, 51, 52, 54, 55, 56, 59, 62, 63, 66, 68, 77,
           81, 82, 83, 84, 86, 87, 89, 99, 106, 108, 109, 110, 117,
           124, 128, 129, 132, 133, 136, 139, 140, 141, 145, 146, 159, 165, 166, 167, 172]
  # keep: genuine close-up, the machine really fills the frame; old polygon kept.
  keep: [4, 6, 11, 13, 15, 20, 28, 30, 36, 43, 50, 53, 58, 65, 69, 70, 71, 75, 76, 79,
         85, 90, 91, 92, 93, 94, 95, 97, 100, 101, 102, 104, 113, 115, 120, 122, 123,
         144, 152, 153, 157, 158, 162, 168, 171, 173, 174]
  # quarantine: neither label is right (collage, infographic strip, inset photos, floor/room included,
  # several machines). The whole image is excluded until a human re-draws it.
  quarantine: [0, 1, 2, 22, 29, 32, 37, 39, 40, 42, 44, 45, 57, 60, 61, 64, 67, 72, 73, 74, 78,
               80, 88, 96, 98, 103, 105, 107, 111, 112, 114, 116, 118, 119,
