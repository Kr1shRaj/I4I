negatives:
  # Screening of the empty-label (negative) images, 2026-10-21: scripts/tools/audit_negatives.py
  # (run5 + run6 at conf 0.10 and contact sheets in label_fixes/negative_audit/), reviewed by Claude.
  # quarantine: an unlabelled target machine is visible -> dropped from the negative lists.
  quarantine:
    img_dust_collector_ddgs_00198_jpg.rf.aced5100d649e8f457cc051c6e6df1d5: "benchtop planer + mitre saw on the bench, small"
    img_glue_spreader_ddgs_00455_jpg.rf.9fba14de6de10ce4b295766434085a37: "sliding-table panel saw cut off at the right edge"
    img_mortiser_ddgs_00244_jpg.rf.912be2dc99f501f6f825e15953118e6b: "horizontal band saw in the background"
    img_wood_lathe_ddgs_00220_jpg.rf.24312787786f31bdc55a28c806f7a11c: "band saw behind the lathe, half hidden"
    img_dust_collector_ddgs_00464_jpg.rf.48528eab47ab9a882f6ed6ffc9abdcad: "illustration: table saw, band saw, jointer, planer"
  # Source classes never used as negatives. veneer_press (37): the factory press on Camera 03 is a
  # woodworking hot/cold press that the CCTV benchmark labels hydraulic_press, so a veneer-press
  # negative would teach that press to be background. Open decision: relabel them as hydraulic_press.
  exclude_source_classes: [37]

